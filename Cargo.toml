[workspace]
resolver = "2"
members = [
    "injectable-rs",
    "injectable-rs-macros",
    "injectable-rs-runtime",
    "injectable-rs-graph",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Jim Chng <jimchng@outlook.com>"]
readme = "README.md"
homepage = "https://github.com/jymchng/injectable"
repository = "https://github.com/jymchng/injectable"
rust-version = "1.86"

[workspace.dependencies]
# Internal crates
injectable-rs-macros = {version = "0.1.0", path = "injectable-rs-macros"}
injectable-rs-runtime = {version = "0.1.0", path = "injectable-rs-runtime"}
injectable-rs-graph = {version = "0.1.0", path = "injectable-rs-graph"}

# Shared dependencies
async-trait = "^0.1.67"
axum = "^0.7.3"
futures-util = "0.3.32"
http-body-util = "0.1"
hyper = "^1.1.0"
tokio = { version = "^1.48.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "^1.0.194", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
inventory = "0.3.24"
tower = { version = "^0.5.0", features = ["util"] }
trybuild = "=1.0.119"

# Pinned transitive deps to keep MSRV at 1.86 (ICU 2.3.0 requires rustc 1.88)
icu_collections = "=2.1.1"
icu_locale_core = "=2.1.1"
icu_normalizer = "=2.1.1"
icu_normalizer_data = "=2.1.1"
icu_properties = "=2.1.1"
icu_properties_data = "=2.1.1"
icu_provider = "=2.1.1"
idna_adapter = "=1.2.1"

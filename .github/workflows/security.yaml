name: Security

on:
  schedule:
    - cron: "0 8 * * 1"          # every Monday at 08:00 UTC
  push:
    paths:
      - Cargo.lock
      - Cargo.toml
      - "**/Cargo.toml"
  workflow_dispatch:

jobs:
  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Cargo.lock (not tracked in git)
        run: cargo generate-lockfile

      - name: Audit dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2023-0071 (rsa 0.9.10, Marvin Attack, medium): a transitive
          # dependency with NO fixed upgrade available. Tracked here so the
          # audit stays green; remove once upstream ships a patched rsa.
          ignore: RUSTSEC-2023-0071
